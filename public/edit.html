<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phone Deck 편집</title>
  <link rel="icon" href="/icon.png">
  <style>
    :root {
      --bg: #0b0b0d; --panel: #131316; --panel2: #18181c; --line: #26262c; --tile: #111113; --tile-edge: #1f1f24;
      --text: #e9e9ee; --label: #cfcfd8; --muted: #8b8b96; --accent: #2bd46a; --err: #ff5c5c; --violet: rgba(150,110,255,.28);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font-family: "Segoe UI", "Malgun Gothic", -apple-system, "Apple SD Gothic Neo", sans-serif; font-size: 14px; }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    body { display: flex; flex-direction: column; }

    header { display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-bottom: 1px solid var(--line); background: var(--panel); }
    header h1 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: .5px; }
    header .sub { color: var(--muted); font-size: 12px; }
    header .spacer { flex: 1; }
    #status { color: var(--muted); font-size: 13px; }
    #status.dirty { color: #ffd43b; }
    #status.err { color: var(--err); }
    .btn { padding: 8px 14px; border: 0; border-radius: 9px; background: #26262c; font-weight: 600; }
    .btn:hover { background: #303038; }
    .btn.primary { background: var(--accent); color: #06210f; }
    .btn.primary:disabled { opacity: .4; cursor: default; }
    .btn.danger { background: #3a1a1e; color: #ffb3b3; }
    .btn.small { padding: 5px 10px; font-size: 12px; }

    main { flex: 1; min-height: 0; display: grid; grid-template-columns: 230px 1fr 400px; }
    aside, section { min-height: 0; overflow-y: auto; }
    .col-left { border-right: 1px solid var(--line); background: var(--panel); padding: 14px; display: flex; flex-direction: column; gap: 18px; }
    .col-right { border-left: 1px solid var(--line); background: var(--panel); padding: 16px; }
    h2 { margin: 0 0 8px; font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .5px; }

    .pages { display: flex; flex-direction: column; gap: 4px; }
    .page-row { display: flex; align-items: center; gap: 4px; padding: 4px 4px 4px 10px; border-radius: 9px; background: var(--panel2); }
    .page-row.on { box-shadow: inset 0 0 0 1px var(--accent); background: #15211a; }
    .page-row .num { width: 18px; color: var(--muted); font-size: 12px; }
    .page-row input { flex: 1; min-width: 0; padding: 6px 4px; border: 0; background: transparent; outline: none; }
    .page-row input:focus { background: #0d0d10; border-radius: 6px; }
    .icon-btn { width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 6px; background: none; color: var(--muted); padding: 0; }
    .icon-btn:hover { background: #26262c; color: var(--text); }
    .icon-btn svg { width: 15px; height: 15px; }

    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { display: inline-flex; align-items: center; gap: 4px; padding: 4px 6px 4px 10px; border: 0; border-radius: 99px; background: #1f2a23; color: #bff5d2; font-size: 12px; }
    .chip.add { padding: 4px 10px; background: #1b1b20; color: var(--label); }
    .chip.add:hover { background: #26262c; }
    .chip .x { width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 50%; background: none; color: inherit; padding: 0; }
    .chip .x:hover { background: rgba(255,255,255,.12); }
    .chip.now::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
    .settings label { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 5px 0; color: var(--label); }
    input[type=number], .field input, .field select, .field textarea {
      padding: 8px 10px; border: 1px solid #2a2a30; border-radius: 8px; background: #0d0d10; outline: none; }
    input[type=number] { width: 70px; }
    .field input:focus, .field select:focus, .field textarea:focus, input[type=number]:focus { border-color: var(--accent); }

    .center { padding: 22px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .hint { color: var(--muted); font-size: 12px; text-align: center; }
    .grid { display: grid; gap: 8px; padding: 12px; border-radius: 20px; background: #060607; box-shadow: inset 0 2px 6px rgba(0,0,0,.9), 0 0 0 1px var(--violet);
      grid-template-columns: repeat(var(--cols), 92px); grid-auto-rows: 92px; }
    .cell { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; padding: 4px; border: 0; border-radius: 12px;
      background: var(--tile); box-shadow: inset 0 0 0 1px var(--key-color, var(--tile-edge)); color: var(--text); overflow: hidden; }
    .cell.empty { background: transparent; box-shadow: inset 0 0 0 1px #1a1a1f; color: #3a3a44; font-size: 22px; }
    .cell.empty:hover { color: var(--accent); box-shadow: inset 0 0 0 1px #2a2a30; }
    .cell.dial { border-radius: 14px; }
    .cell.sel { box-shadow: inset 0 0 0 2px var(--accent); }
    .cell.over { box-shadow: inset 0 0 0 2px #4a7dff; background: #121a2a; }
    .cell svg { width: 28px; height: 28px; stroke: #f2f2f6; stroke-width: 1.6; }
    .cell .img { width: 38px; height: 38px; object-fit: contain; }
    .cell .ic { font-size: 28px; line-height: 1; }
    .cell .lb { font-size: 11px; font-weight: 600; color: var(--label); text-align: center; line-height: 1.15; max-width: 100%;
      overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .cell .tag { position: absolute; top: 5px; right: 6px; font-size: 10px; color: var(--muted); }
    .cell.dial .knob { width: 70%; aspect-ratio: 1; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle, #000 58%, #2a2a30 59%, #141418 70%, #0a0a0c 71%); box-shadow: 0 0 0 1px #2c2c33; }

    .insp { display: flex; flex-direction: column; gap: 14px; }
    .insp-empty { color: var(--muted); text-align: center; padding: 40px 10px; line-height: 1.7; }
    .seg { display: flex; gap: 4px; padding: 3px; border-radius: 10px; background: #0d0d10; }
    .seg button { flex: 1; padding: 7px; border: 0; border-radius: 8px; background: none; color: var(--muted); font-weight: 600; }
    .seg button.on { background: #26262c; color: var(--text); }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field > span { font-size: 12px; color: var(--muted); font-weight: 600; }
    .field textarea { min-height: 70px; resize: vertical; }
    .row { display: flex; gap: 8px; align-items: center; }
    .row > * { min-width: 0; }
    .grow { flex: 1; }
    .swatches { display: flex; gap: 7px; flex-wrap: wrap; }
    .swatch { width: 24px; height: 24px; border-radius: 50%; border: 0; padding: 0; box-shadow: inset 0 0 0 1px rgba(255,255,255,.15); }
    .swatch.none { background: linear-gradient(135deg, transparent 45%, var(--err) 45% 55%, transparent 55%), #111113; }
    .swatch.on { box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px #fff; }
    .box { display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: 12px; background: var(--panel2); }
    .rec { display: flex; gap: 6px; }
    .rec input { flex: 1; font-family: Consolas, monospace; }
    .rec input.recording { border-color: #ff5c8a; box-shadow: 0 0 0 2px rgba(255,92,138,.25); }
    .steps { display: flex; flex-direction: column; gap: 8px; }
    .step { display: flex; flex-direction: column; gap: 8px; padding: 10px; border-radius: 10px; background: #0f0f12; }
    .step-head { display: flex; align-items: center; gap: 4px; color: var(--muted); font-size: 12px; font-weight: 700; }
    .warn { color: #ffcf7a; font-size: 12px; line-height: 1.5; }
    .actions-bar { display: flex; gap: 8px; flex-wrap: wrap; padding-top: 4px; border-top: 1px solid var(--line); }

    .modal { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.6); z-index: 20; }
    .modal[hidden] { display: none; }
    .modal-card { width: min(560px, 92vw); max-height: 80vh; display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: 16px; background: var(--panel); box-shadow: 0 0 0 1px var(--violet); }
    .app-list { overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
    .app-list button { text-align: left; padding: 8px 10px; border: 0; border-radius: 8px; background: none; }
    .app-list button:hover { background: #26262c; }
    #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); padding: 10px 16px; border-radius: 10px; background: #24242a;
      box-shadow: 0 6px 24px rgba(0,0,0,.5); opacity: 0; transition: opacity .2s; pointer-events: none; }
    #toast.show { opacity: 1; }
    #toast.err { background: #3a1a1e; }
  </style>
</head>
<body>
  <header>
    <h1>phonedeck 편집</h1>
    <span class="sub" id="sub"></span>
    <span class="spacer"></span>
    <span id="status"></span>
    <button class="btn" id="revertBtn" type="button">되돌리기</button>
    <button class="btn primary" id="saveBtn" type="button" disabled>저장</button>
  </header>

  <main>
    <aside class="col-left">
      <div>
        <h2>페이지</h2>
        <div class="pages" id="pages"></div>
        <button class="btn small" id="addPage" type="button" style="margin-top:8px">＋ 페이지 추가</button>
      </div>
      <div>
        <h2>이 페이지 자동으로 열기</h2>
        <div class="hint" style="text-align:left;margin-bottom:8px">아래 프로그램이 PC 앞에 오면 아이폰이 이 페이지로 바뀝니다.</div>
        <div class="chips" id="pageApps"></div>
        <div class="row" style="margin-top:8px">
          <input class="grow" id="pageAppInput" placeholder="프로그램 이름" style="padding:7px 9px;border:1px solid #2a2a30;border-radius:8px;background:#0d0d10">
          <button class="btn small" id="pageAppAdd" type="button">추가</button>
        </div>
        <div class="hint" style="text-align:left;margin:10px 0 6px">최근 앞에 있던 프로그램 (클릭해서 추가)</div>
        <div class="chips" id="recentApps"></div>
      </div>
      <div class="settings">
        <h2>전체 설정</h2>
        <label>세로 화면 열 수 <input type="number" id="setCols" min="2" max="8"></label>
        <label>가로 화면 열 수 <input type="number" id="setLCols" min="2" max="10"></label>
        <label>최소 줄 수 <input type="number" id="setRows" min="1" max="10"></label>
        <label>다이얼 딸깍 소리 <input type="checkbox" id="setSound"></label>
        <label>프로그램별 자동 페이지 전환 <input type="checkbox" id="setAuto"></label>
      </div>
    </aside>

    <section class="center">
      <div class="grid" id="grid"></div>
      <div class="hint">칸을 클릭해서 편집 · 끌어서 자리 바꾸기 · 빈칸을 클릭하면 새 버튼</div>
    </section>

    <aside class="col-right">
      <div class="insp" id="insp"></div>
    </aside>
  </main>

  <div class="modal" id="appModal" hidden>
    <div class="modal-card">
      <div class="row"><input class="grow" id="appSearch" placeholder="앱 이름 검색" style="padding:9px 11px;border:1px solid #2a2a30;border-radius:8px;background:#0d0d10"><button class="btn" id="appClose" type="button">닫기</button></div>
      <div class="app-list" id="appList"></div>
    </div>
  </div>
  <div id="toast"></div>

  <script src="/lucide.min.js"></script>
  <script src="/icon-picker.js"></script>
  <script src="/edit.js"></script>
</body>
</html>
